plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.redouaneinstall.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.redouaneinstall.app"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"

        // هواتف حقيقية فقط (x86 خاصة بالمحاكيات) — تصغير حجم الحزمة
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt",
                         "META-INF/license.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt",
                         "META-INF/notice.txt", "META-INF/ASL2.0", "META-INF/*.kotlin_module"]
        }
    }
}

dependencies {
    // Compose (Material 3)
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // تحميل صور المصغّرات (Coil)
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // محرك yt-dlp لأندرويد + ffmpeg (نفس مكتبات تطبيق Seal المفتوح المصدر)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
